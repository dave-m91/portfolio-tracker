[project]
name = "portfolio-tracker"
version = "0.1.0"
description = "CLI application for tracking an investment portfolio"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.21",
    "yfinance>=0.2.50",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]